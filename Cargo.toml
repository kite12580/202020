[package]
name = "twenty-twenty-twenty"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/capsule-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
tiny-skia = "0.12.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

capsule-core = { path = "crates/capsule-core" }
log = { version = "=0.4.35", features = ["std"] }
windows-core = "=0.62.2"
windows-numerics = "=0.3.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Security",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Registry",
  "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Power",
  "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx", "Win32_Globalization", "Win32_System_ProcessStatus",
  "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "202020"
path = "src/main.rs"
