name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked -p twenty-twenty-twenty -p capsule-hook

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/202020.exe
            target/release/capsule_hook.dll
          generate_release_notes: true
