[package]
name = "capsule-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.2.1", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "=0.25.19", features = ["parse", "display"] }
log = "=0.4.35"
nucleo-matcher = { version = "=0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
