[package]
name = "capsule-hook"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
capsule-core = { path = "../capsule-core" }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
