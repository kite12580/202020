[package]
name = "capsule-hook"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
capsule-core = { path = "../capsule-core" }
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_DataExchange",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
] }
